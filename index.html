<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Prospector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-viewport" class="area-shady">
        
        <div id="world-map">
            <div id="map-grid-display"></div>
        </div>

        <aside id="sidebar">
            <header id="game-header">
                <h2>PROSPECTING</h2>
                <h3 id="current-area">SHADY CREEK</h3>
            </header>

            <div id="stats-panel">
                <div class="stat-row">Cash: <span id="stat-cash" class="yellow">$0</span></div>
                <div class="stat-row">Dirt Bag: <span id="stat-dirt">0/5</span></div>
                <div class="stat-row">Shovel: <span id="stat-shovel" class="accent">Rusty Shovel</span></div>
                <div class="stat-row">Pan: <span id="stat-pan" class="accent">Wooden Pan</span></div>
            </div>

            <div id="action-prompt">Use W/A/S/D to explore.</div>

            <div id="activity-log">
                <div class="log-entry system">Welcome to the wilderness.</div>
            </div>

            <div id="inventory-display">Minerals: None</div>
        </aside>

        <div id="shop-overlay" class="hidden">
            <div id="shop-modal">
                <h2>GENERAL STORE & TRADING</h2>
                <p>Balance: <span id="shop-cash" class="yellow">$0</span></p>
                <div class="shop-buttons">
                    <button onclick="game.sellMinerals()">1. Sell All Minerals</button>
                    <button id="btn-upgrade-shovel" onclick="game.upgradeShovel()">2. Upgrade Shovel</button>
                    <button id="btn-upgrade-pan" onclick="game.upgradePan()">3. Upgrade Pan</button>
                    <button onclick="game.showTravelMenu()">4. Travel to a New District</button>
                    <button onclick="game.closeShop()">5. Head Back Outside</button>
                </div>
                <div id="travel-menu" class="hidden">
                    <h3>Select Destination:</h3>
                    <button onclick="game.travelTo('Shady Creek')">Shady Creek (Tier 1)</button>
                    <button onclick="game.travelTo('Crimson Canyons')">Crimson Canyons (Tier 2)</button>
                    <button onclick="game.travelTo('Glacial Chasm')">Glacial Chasm (Tier 3)</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
